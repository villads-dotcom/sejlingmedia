<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book et møde | Sejling Media</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#03080d;
  color:#f4f9fc;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 78% 20%,#168fdc17,transparent 34%),
    radial-gradient(circle at 18% 80%,#0b71aa0d,transparent 30%)
}

header{
  height:84px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(20px,5vw,72px);
  border-bottom:1px solid #ffffff0c;
  position:relative;
  z-index:2
}

.logo{
  width:178px;
  height:58px;
  object-fit:contain;
  object-position:left center
}

.back{
  color:#9bb0bd;
  text-decoration:none;
  font-size:14px
}

.back:hover{color:#fff}

main{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:58px 0 80px;
  position:relative
}

.top{
  text-align:center;
  max-width:700px;
  margin:0 auto 42px
}

.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  color:#77ccff;
  font-weight:800
}

.top h1{
  font-size:clamp(34px,5vw,58px);
  line-height:1.03;
  letter-spacing:-.045em;
  margin:10px 0 13px
}

.top p{
  color:#8fa7b7;
  line-height:1.65;
  margin:0
}

.booking{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(330px,.72fr);
  border:1px solid #ffffff12;
  border-radius:24px;
  background:#071119c9;
  overflow:hidden;
  box-shadow:0 35px 100px #0008
}

.calendar{padding:34px}

.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:26px
}

.calendar-head strong{
  text-transform:capitalize;
  font-size:19px
}

.nav{
  width:44px;
  height:44px;
  border-radius:12px;
  border:1px solid #ffffff13;
  background:#ffffff07;
  color:#fff;
  font-size:18px;
  cursor:pointer
}

.week,.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px
}

.week{margin-bottom:8px}

.week span{
  text-align:center;
  color:#617887;
  font-size:11px
}

.day{
  aspect-ratio:1;
  border:1px solid #ffffff0c;
  border-radius:13px;
  background:#ffffff04;
  color:#dceaf3;
  font-size:14px;
  cursor:pointer;
  transition:.18s
}

.day:hover:not(:disabled){
  border-color:#63c6ff80;
  background:#59c5ff12
}

.day.selected{
  background:#67caff;
  color:#041019;
  border-color:#67caff;
  font-weight:800
}

.day:disabled{
  opacity:.18;
  cursor:default
}

.day.blank{visibility:hidden}

.side{
  padding:34px;
  border-left:1px solid #ffffff10;
  background:#040b11a8
}

.side h2{
  font-size:22px;
  margin:0 0 8px
}

.side>p{
  color:#8198a7;
  font-size:13px;
  line-height:1.55;
  margin:0 0 24px
}

.times{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.time{
  padding:13px 10px;
  border-radius:11px;
  border:1px solid #ffffff12;
  background:#ffffff05;
  color:#e7f5fc;
  cursor:pointer
}

.time:hover,.time.selected{
  border-color:#69c9ff;
  background:#59c5ff16
}

.form{
  display:grid;
  gap:13px;
  margin-top:22px
}

.form[hidden],.success[hidden]{
  display:none
}

.slot{
  padding:12px;
  border-radius:10px;
  background:#55c2ff10;
  color:#c9ecff;
  font-size:12px
}

.form label{
  display:grid;
  gap:6px;
  color:#8fa6b4;
  font-size:11px
}

.form input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ffffff14;
  background:#02070b;
  color:#fff;
  font:inherit;
  outline:0
}

.form input:focus{
  border-color:#69c9ff
}

.submit{
  min-height:48px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#071018;
  font-weight:800;
  cursor:pointer;
  margin-top:3px
}

.note{
  font-size:10px;
  color:#607785;
  line-height:1.5
}

.success{
  padding:20px;
  border:1px solid #65caff35;
  border-radius:14px;
  background:#55c2ff0b;
  margin-top:20px
}

.success strong{font-size:18px}

.success p{
  color:#8fa6b4;
  line-height:1.5
}

.mail{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:14px;
  border-radius:11px;
  background:#fff;
  color:#071018;
  font-weight:800
}

.calendly-booking{display:block}

.calendly-inline-widget{
  border-radius:24px;
  overflow:hidden
}

@media(max-width:800px){
  header{height:72px}
  .logo{width:145px}
  .booking{grid-template-columns:1fr}
  .side{
    border-left:0;
    border-top:1px solid #ffffff10
  }
  .calendar,.side{padding:22px}
  .week,.days{gap:4px}
  .day{border-radius:9px}
  main{padding-top:38px}
}
</style>

<link
  href="https://assets.calendly.com/assets/external/widget.css"
  rel="stylesheet"
>

<main>

<div class="top">

<div class="eyebrow">
SEJLING MEDIA · BOOKING
</div>

<h1>
Book en uforpligtende snak
</h1>

<p>
Vælg en dato og et tidspunkt, der passer dig.
Samtalen tager ca. 30 minutter, og vi tager
udgangspunkt i din virksomhed og dine mål.
</p>

</div>

<section class="booking calendly-booking">

<div
  class="calendar"
  style="grid-column:1/-1;padding:0;min-height:760px"
>

<div
  class="calendly-inline-widget"
  data-url="https://calendly.com/villads-sejlingmedia/30min?hide_gdpr_banner=1&background_color=071119&text_color=f4f9fc&primary_color=67caff"
  style="min-width:320px;height:760px"
></div>

</div>

</section>

</main>


<!-- CALENDLY -->
<script
src="https://assets.calendly.com/assets/external/widget.js"
async>
</script>


<!--
====================================================
META PIXEL — COMPLETED CALENDLY BOOKING TRACKING
====================================================

Schedule bliver IKKE sendt ved:
- Page load
- Åbning af Calendly
- Valg af dato
- Valg af tidspunkt
- Klik på booking

Schedule bliver KUN sendt når Calendly sender:
calendly.event_scheduled
====================================================
-->

<script>
(function () {

  let scheduleSent = false;

  window.addEventListener('message', function(event) {

    /*
     * Calendlys embed kommunikerer med siden via
     * window.postMessage().
     *
     * Vi accepterer kun events fra Calendly.
     */
    if (event.origin !== 'https://calendly.com') {
      return;
    }

    /*
     * Kun Calendlys officielle event for
     * gennemført booking må udløse Schedule.
     */
    if (
      event.data &&
      event.data.event === 'calendly.event_scheduled' &&
      scheduleSent === false
    ) {

      /*
       * Lås med det samme, så samme booking
       * ikke kan sende Schedule flere gange.
       */
      scheduleSent = true;

      /*
       * Kontroller at Meta Pixel/base pixel
       * eksisterer før eventet sendes.
       */
      if (typeof window.fbq === 'function') {

        window.fbq(
          'track',
          'Schedule'
        );

        console.log(
          'Sejling Media: Meta Schedule event sent after completed Calendly booking.'
        );

      } else {

        console.warn(
          'Sejling Media: Calendly booking completed, but Meta Pixel was not available.'
        );

      }

    }

  });

})();
</script>
